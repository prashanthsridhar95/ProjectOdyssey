<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2c455d">
    <meta name="description" content="Book a car wash near you. See live slots, prices and wait times, then pay in the app.">
    <title>Rinse · Book a car wash near you</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232c455d'/%3E%3Cpath d='M16 6c4 5 6 8.5 6 11.5a6 6 0 0 1-12 0C10 14.5 12 11 16 6z' fill='none' stroke='%23d6ebff' stroke-width='2'/%3E%3C/svg%3E">
    <style>
        html, body { margin: 0; height: 100%; background: #f2f2f3; overflow: hidden; }
        #app { position: fixed; inset: 0; background: #f2f2f3; }
        /* Shown while the app's WebAssembly downloads; removed as soon as the app draws its first frame. */
        #splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
            background: linear-gradient(180deg, #2c455d, #1d2d3d); color: #d6ebff; font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity .35s ease; }
        #splash::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(181,217,253,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(181,217,253,.08) 1px, transparent 1px); background-size: 16px 16px; }
        #splash .word { position: relative; font: 700 34px/1 "Barlow Condensed", system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #eef6ff; }
        #splash .bar { position: relative; width: 140px; height: 2px; background: rgba(181,217,253,.2); overflow: hidden; }
        #splash .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: #b5d9fd; animation: slide 1.1s ease-in-out infinite; }
        #splash .hint { position: relative; color: rgba(214,235,255,.7); font-size: 13px; }
        #splash.gone { opacity: 0; pointer-events: none; }
        @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
        @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
        noscript { position: fixed; inset: 0; z-index: 11; display: grid; place-items: center; background: #f2f2f3; font: 15px system-ui, sans-serif; color: #1d1f20; padding: 24px; text-align: center; }
    </style>
    <script src="config.js"></script>
    <script src="customer.js" defer></script>
</head>
<body>
<div id="app"></div>
<div id="splash" role="status" aria-live="polite">
    <svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true" style="position:relative"><rect x="0.5" y="0.5" width="31" height="31" fill="none" stroke="#b5d9fd" stroke-opacity=".5"/><path d="M16 6c4 5 6 8.5 6 11.5a6 6 0 0 1-12 0C10 14.5 12 11 16 6z" fill="none" stroke="#d6ebff" stroke-width="1.6"/></svg>
    <div class="word">Rinse</div>
    <div class="bar"></div>
    <div class="hint" id="splash-hint">Getting things ready…</div>
</div>
<noscript>Rinse needs JavaScript turned on. Turn it on in your browser settings and reload the page.</noscript>
<script>
    (function () {
        var splash = document.getElementById('splash'), app = document.getElementById('app');
        function done() { splash.classList.add('gone'); setTimeout(function () { splash.remove(); }, 400); }
        var gone = false;
        // The app calls this once it has its configuration and draws its first real screen.
        window.odysseyReady = function () { if (!gone) { gone = true; setTimeout(done, 120); } };
        setTimeout(window.odysseyReady, 30000); // never leave someone on the splash forever
        // A very old browser cannot run the app at all: say so instead of loading forever.
        if (typeof WebAssembly !== 'object') document.getElementById('splash-hint').textContent = 'This browser is too old for Rinse. Please update it, or use Chrome, Edge, Firefox or Safari.';
        else setTimeout(function () { var h = document.getElementById('splash-hint'); if (h) h.textContent = 'Still loading. A slow connection can take a little longer.'; }, 8000);
    })();
</script>
</body>
</html>
