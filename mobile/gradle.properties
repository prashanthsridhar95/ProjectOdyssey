org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=true
# iOS targets are off by default so Android builds stay fast and need no Kotlin/Native toolchain.
# Turn them on with: ./gradlew build -Podyssey.ios=true   (needs Xcode)
odyssey.ios=false
