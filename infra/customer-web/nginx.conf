# Serves the customer web app (Kotlin/Wasm bundle) on :5175 and proxies the API at /v1 on the same address.
# scripts/build-customer-web.sh writes .br and .gz copies of the big files; they are sent as-is, never compressed per request.
upstream odyssey_api { server backend:8080; keepalive 32; }

map $http_accept_encoding $odyssey_br { default ""; "~*\bbr\b" "1"; }

server {
    listen 5175;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml font/ttf;

    location /v1/ {
        proxy_pass http://odyssey_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /config.js { add_header Cache-Control "no-store"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # The .wasm files are content-hashed, so they cache for a year. Brotli when the browser takes it, else gzip.
    location ~* ^(?<odyssey_file>/[^/]+\.wasm)$ {
        if ($odyssey_br) { rewrite ^ /__br/wasm$odyssey_file.br last; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept-Encoding;
    }
    # customer.<hash>.js is content-hashed by scripts/build-customer-web.sh, so it caches for a year too.
    location ~* ^(?<odyssey_js>/customer\.[0-9a-f]+\.js)$ {
        if ($odyssey_br) { rewrite ^ /__br/js$odyssey_js.br last; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept-Encoding;
    }
    location ~* ^/composeResources/(?<odyssey_font>.+\.ttf)$ {
        if ($odyssey_br) { rewrite ^ /__br/ttf/composeResources/$odyssey_font.br last; }
        add_header Cache-Control "public, max-age=604800";
        add_header Vary Accept-Encoding;
    }
    location /__br/wasm/ { internal; gzip off; alias /usr/share/nginx/html/; types { } default_type application/wasm;
        add_header Content-Encoding br; add_header Vary Accept-Encoding; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /__br/js/ { internal; gzip off; alias /usr/share/nginx/html/; types { } default_type application/javascript;
        add_header Content-Encoding br; add_header Vary Accept-Encoding; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /__br/ttf/ { internal; gzip off; alias /usr/share/nginx/html/; types { } default_type font/ttf;
        add_header Content-Encoding br; add_header Vary Accept-Encoding; add_header Cache-Control "public, max-age=604800"; }

    location / { try_files $uri /index.html; }
}
