# Serves the customer web app (Kotlin/Wasm bundle) on :5175.
server {
    listen 5175;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml font/ttf;
    location = /config.js { add_header Cache-Control "no-store"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /customer.js { add_header Cache-Control "no-cache"; }   # the .wasm files are content-hashed, so they can cache
    location / { try_files $uri /index.html; }
}
