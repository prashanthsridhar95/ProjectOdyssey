# Serves the two consoles (admin :5173, vendor :5174) and proxies the API on the same address, so the browser never opens
# a second connection or sends CORS pre-checks. Hashed build files cache forever; the HTML always revalidates.
upstream odyssey_api { server backend:8080; keepalive 32; }

server {
    listen 5173;
    root /usr/share/nginx/admin;
    include /etc/nginx/conf.d/odyssey-common.inc;
}

server {
    listen 5174;
    root /usr/share/nginx/vendor;
    include /etc/nginx/conf.d/odyssey-common.inc;
}
